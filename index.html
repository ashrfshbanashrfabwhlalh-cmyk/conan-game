<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحقق: سجل القضايا الغامضة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e14;
            color: #d1d7e0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-card {
            background: #161b22;
            width: 100%;
            max-width: 520px;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }
        .sound-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        h1 { color: #f0883e; text-align: center; margin: 0 0 5px 0; font-size: 1.3rem; }
        .sub { text-align: center; font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .level-box { color: #58a6ff; }
        .score-box { color: #3fb950; }
        .scene-box {
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #f0883e;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 90px;
            white-space: pre-line;
            font-size: 0.95rem;
        }
        .btn-stack { display: flex; flex-direction: column; gap: 8px; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #2ea043; }
        button.tool-btn { background: #1f6feb; }
        button.tool-btn:hover { background: #388bfd; }
        button.danger { background: #da3633; }
        button.danger:hover { background: #f85149; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .inventory-panel {
            margin-top: 15px;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #30363d;
            font-size: 0.85rem;
        }
        .leaderboard {
            margin-top: 15px;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .leaderboard h3 { margin: 0 0 10px 0; color: #58a6ff; font-size: 0.95rem; text-align: center; }
        .ranking-scroll {
            max-height: 220px;
            overflow-y: auto;
            padding-left: 5px;
        }
        .ranking-scroll::-webkit-scrollbar { width: 5px; }
        .ranking-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        .ranking-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 4px;
            border-bottom: 1px solid #21262d;
            font-size: 0.85rem;
        }
        .ranking-row:nth-child(1) { color: #f1e05a; font-weight: bold; }
        .ranking-row:nth-child(2) { color: #c0c0c0; font-weight: bold; }
        .ranking-row:nth-child(3) { color: #cd7f32; font-weight: bold; }
        .developer-footer {
            text-align: center;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #30363d;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .contact-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            color: #ffffff;
        }
        .wa-btn { background-color: #238636; }
        .fb-btn { background-color: #1877f2; }
    </style>
</head>
<body>

<div id="game-card">
    <button class="sound-btn" onclick="toggleMute()" id="mute-btn">🔊 الصوت: مفعل</button>
    <h1>المحقق: سجل القضايا الغامضة</h1>
    <div class="sub">أكثر من 100 سيناريو جنائي حصري وغير مكرر</div>

    <div class="status-bar">
        <div class="level-box" id="level-display">القضية: #1</div>
        <div class="score-box" id="score-display">النقاط: 0</div>
    </div>

    <div class="scene-box" id="scene-text">
        سجل اسمك لتبدأ تولي ملفات الجرائم المعقدة، وابحث عن التناقضات!
    </div>

    <div class="btn-stack" id="actions">
        <input type="text" id="player-name" placeholder="اكتب اسم المحقق هنا" maxlength="15">
        <button id="start-btn" onclick="handleStartBtn()">تولي ملف القضية</button>
    </div>

    <div class="inventory-panel" id="clues-box" style="display: none;">
        <strong style="color: #58a6ff;">💼 حقيبة الأدلة المستجمعة:</strong>
        <div id="clues-list">لا توجد أدلة بعد.</div>
    </div>

    <div class="leaderboard">
        <h3>🏆 قائمة أفضل 100 محقق متصدر</h3>
        <div class="ranking-scroll" id="ranking-list">جارٍ تحميل الترتيب...</div>
    </div>

    <div class="developer-footer">
        <div>تطوير وبرمجة: <strong>أشرف أبو حلالة</strong></div>
        <div class="contact-links">
            <a href="https://wa.me/218923853295" target="_blank" class="contact-btn wa-btn">💬 واتساب</a>
            <a href="https://www.facebook.com/ashrafabuhalala" target="_blank" class="contact-btn fb-btn">🌐 فيسبوك</a>
        </div>
    </div>
</div>

<script>
    const bgMusic = new Audio("https://cdn.freesound.org/previews/415/415804_5121236-lq.mp3");
    const climaxMusic = new Audio("https://cdn.freesound.org/previews/172/172561_174499-lq.mp3");
    const ringSound = new Audio("https://cdn.freesound.org/previews/218/218333_3905081-lq.mp3");
    bgMusic.loop = true;
    let isMuted = false;

    function playBgMusic() { if (!isMuted) bgMusic.play().catch(() => {}); }
    function toggleMute() {
        isMuted = !isMuted;
        bgMusic.muted = climaxMusic.muted = ringSound.muted = isMuted;
        document.getElementById("mute-btn").innerText = isMuted ? "🔇 الصوت: مكتوم" : "🔊 الصوت: مفعل";
    }

    const firebaseConfig = {
        apiKey: "AIzaSyB32ymAp82BykjnGOgD0K7bVlW488N_iio",
        authDomain: "detective-game-33111.firebaseapp.com",
        databaseURL: "https://detective-game-33111-default-rtdb.firebaseio.com",
        projectId: "detective-game-33111",
        storageBucket: "detective-game-33111.appspot.com",
        messagingSenderId: "1027770211932",
        appId: "1:1027770211932:web:fc3c00c77609a67e411ba7",
        measurementId: "G-LN495367G4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loadLeaderboard() {
        db.ref("leaderboard").on("value", snap => {
            const list = document.getElementById("ranking-list");
            list.innerHTML = "";
            const data = snap.val();
            if (!data) {
                list.innerText = "لا توجد سجلات بعد، ابدأ وكن الأول!";
                return;
            }

            let ranks = Object.values(data);
            ranks.sort((a, b) => (b.score || 0) - (a.score || 0));

            ranks.slice(0, 100).forEach((val, i) => {
                list.innerHTML += `<div class="ranking-row">
                    <span>#${i + 1} ${val.name}</span>
                    <span>${val.score || 0} نقطة (المرحلة ${val.stage || 1})</span>
                </div>`;
            });
        });
    }
    loadLeaderboard();

    // بنك ضخم من الأسماء لتجنب التكرار
    const VICTIMS = [
        "البارون تاكاماتسو", "الملياردير هاتوري", "المصممة ريبيكا", "الموسيقار شينجي", 
        "الأثري هاكوبا", "البروفيسور ناميكي", "الممثلة ميواكو", "التاجر أوكازاكي", 
        "الكيميائي كاميهارا", "الصحفي ريوسوكي", "المصرفي فوجيوارا", "المؤلف يوشيدا"
    ];

    const SUSPECTS_POOL = [
        { name: "السيد كين", role: "الشريك المالي" },
        { name: "السيدة ريما", role: "مديرة المعارض" },
        { name: "المساعد دايسوكي", role: "السكرتير الشخصي" },
        { name: "الحارس إيزومي", role: "مسؤول الحراسة" },
        { name: "المحامية يوكيكو", role: "المستشارة القانونية" },
        { name: "الطبيب أرايدي", role: "طبيب العائلة" },
        { name: "المهندس أوسامو", role: "خبير الصيانة" },
        { name: "الفنانة كازومي", role: "مصممة الديكور" },
        { name: "الخادم يوشي", role: "المشرف العام" },
        { name: "الكاتب تارو", role: "معد السجلات" },
        { name: "السائقة ماكي", role: "مسؤولة التنقلات" },
        { name: "المصور رين", role: "المصور الشخصي" }
    ];

    const TRICKS = [
        { name: "خيط الصيد المشدود بالمزلاج", clue: "أثر سحجة ميكروسكوبية وخيط شفاف تحت عتبة الباب", tell: "جروح حادة وخفية في باطن الأصابع" },
        { name: "ذوبان مكعب الثلج الجاف الموقوت", clue: "بقعة رطوبة متبخرة وغاز كربوني قرب النافذة", tell: "رائحة مادة تبريد كيميائية في أكمام المعطف" },
        { name: "التسميم الموضعي على فوهة الفنجان المعكوس", clue: "أثر مادة بيضاء على الجهة الخارجية من الكوب", tell: "مسحة تبييض غريبة على أطراف السبابة" },
        { name: "التسجيل الصوتي المربوط بساعة الحائط", clue: "شريط ممغنط تالف داخل صندوق البندول", tell: "ساعة يد غير مضبوطة بفارق عشر دقائق تماماً" },
        { name: "إبرة مسممة داخل بطانة مقبض الباب الداخلي", clue: "ثقب إبرة مجهري ورائحة لوز مرّة بالمقبض", tell: "ارتداء قفاز جلدي فردي في اليد اليمنى فقط" },
        { name: "تلاعب بأسلاك المصعد وثقالة التوازن", clue: "خدوش جديدة على كابل التوقف الفجائي", tell: "آثار شحم صناعي داكن على حافة الحذاء" },
        { name: "قفل الغرفة المغلقة عبر مسطرة كربونية", clue: "شرخ بلاستيكي رفيع ساقط بجانب السجادة", tell: "شظية مسطرة مماثلة مكسورة في الجيب السري" }
    ];

    const MOTIVES = [
        { secret: "خزنة الاختلاس والوثائق المزورة", callTrigger: "سأفتح الخزنة الآن لأكشف تزويرك المالي أمام الشرطة!" },
        { secret: "مسودة الوصية الجديدة وحرمان المستفيدين", callTrigger: "مسودة الوصية بحوزتي ولن تنال مليماً واحداً!" },
        { secret: "تسجيل صوتي سري يوثق جريمة ابتزاز قديمة", callTrigger: "شريط الابتزاز في يدي وسأسلمه للمفتش حالاً!" },
        { secret: "سرقة براءة اختراع طبية نادرة", callTrigger: "لدي الأوراق الأصلية التي تثبت أنك لست المالك الحقيقي!" },
        { secret: "تهريب لوحة فنية أصلية واستبدالها بنسخة مزيفة", callTrigger: "اللوحة الأصلية مكشوفة وكل التفاصيل أصبحت معي!" }
    ];

    let playerName = localStorage.getItem("conan_player_name") || "";
    let currentCaseNum = parseInt(localStorage.getItem("conan_stage")) || 1;
    let totalScore = parseInt(localStorage.getItem("conan_score")) || 0;

    let currentCase = {};
    let collectedClues = [];
    let lastCulpritName = "";
    let lastTrickName = "";

    const levelEl = document.getElementById("level-display");
    const scoreEl = document.getElementById("score-display");
    const textEl = document.getElementById("scene-text");
    const actionsEl = document.getElementById("actions");
    const cluesList = document.getElementById("clues-list");

    if (playerName) {
        document.getElementById("player-name").value = playerName;
        scoreEl.innerText = `النقاط: ${totalScore}`;
        levelEl.innerText = `القضية: #${currentCaseNum}`;
        textEl.innerText = `مرحباً بعودتك يا محقق ${playerName}!\nلديك تقدم محفوظ: المرحلة (${currentCaseNum}) برصيد (${totalScore}) نقطة.`;
    }

    function handleStartBtn() {
        const inputName = document.getElementById("player-name").value.trim();
        if (!inputName) return alert("اكتب اسمك أولاً!");

        const btn = document.getElementById("start-btn");
        btn.innerText = "جارٍ التحقق...";
        btn.disabled = true;

        const playerKey = encodeURIComponent(inputName.toLowerCase());
        const savedLocalName = localStorage.getItem("conan_player_name");

        db.ref("leaderboard/" + playerKey).once("value", snapshot => {
            btn.innerText = "تولي ملف القضية";
            btn.disabled = false;

            if (snapshot.exists() && savedLocalName !== inputName) {
                alert(`⚠️ المحقق "${inputName}" مسجل مسبقاً! اختر اسماً آخر أو أضف رقماً لتمييزه.`);
                return;
            }

            playerName = inputName;
            localStorage.setItem("conan_player_name", playerName);
            playBgMusic();
            document.getElementById("clues-box").style.display = "block";
            startCase();
        });
    }

    // توليد سيناريو فريد في كل مرحلة بدون تكرار الجولة السابقة
    function generateCase() {
        collectedClues = [];
        cluesList.innerHTML = "لا توجد أدلة بعد.";

        const victim = VICTIMS[Math.floor(Math.random() * VICTIMS.length)];
        
        let availableTricks = TRICKS.filter(t => t.name !== lastTrickName);
        const trick = availableTricks[Math.floor(Math.random() * availableTricks.length)];
        lastTrickName = trick.name;

        const motive = MOTIVES[Math.floor(Math.random() * MOTIVES.length)];
        
        let shuffledSuspects = [...SUSPECTS_POOL].sort(() => 0.5 - Math.random()).slice(0, 3);
        
        let candidates = shuffledSuspects.filter(s => s.name !== lastCulpritName);
        const culprit = candidates.length > 0 
            ? candidates[Math.floor(Math.random() * candidates.length)]
            : shuffledSuspects[0];
        lastCulpritName = culprit.name;

        currentCase = { victim, trick, motive, suspects: shuffledSuspects, culprit, calledTrap: false };
        levelEl.innerText = `القضية: #${currentCaseNum}`;
        scoreEl.innerText = `النقاط: ${totalScore}`;
    }

    function addClue(c) {
        if (!collectedClues.includes(c)) {
            collectedClues.push(c);
            cluesList.innerHTML = collectedClues.map(i => `• ${i}`).join("<br>");
        }
    }

    function startCase() {
        generateCase();
        caseHub();
    }

    function setScene(text, buttons) {
        textEl.innerText = text;
        actionsEl.innerHTML = "";
        buttons.forEach(b => {
            const btn = document.createElement("button");
            btn.innerText = b.label;
            if (b.className) btn.className = b.className;
            btn.onclick = b.action;
            actionsEl.appendChild(btn);
        });
    }

    function caseHub() {
        setScene(
            `القضية #${currentCaseNum}: وُجد ${currentCase.victim} جثة هامدة في مسرح الجريمة!\nالمشتبه بهم الحاضرون:\n${currentCase.suspects.map(s => `• ${s.name} (${s.role})`).join('\n')}`,
            [
                { label: "🔍 فحص مسرح الجريمة والآثار", action: inspectCrime },
                { label: "👥 استجواب المشتبه بهم", action: talkSuspects },
                { label: "🎙️ فخ بمغير الصوت (مكالمة وهمية)", action: fakeCall, className: "tool-btn" },
                { label: "⚡ توجيه الاتهام الحاسم!", action: accusePhase, className: "danger" }
            ]
        );
    }

    function inspectCrime() {
        setScene("حدد الموقع المراد فحصه باستخدام أدوات التحقيق:", [
            { label: `فحص جثة الضحية (${currentCase.victim})`, action: () => {
                addClue(`دافع الجريمة: عُثر على خيط يقود إلى [${currentCase.motive.secret}]`);
                setScene(`بعد تفتيش المتعلقات الشخصية، تبين أن الدافع وراء التخلص منه هو:\n${currentCase.motive.secret}.`, [{ label: "فحص أثر آخر", action: inspectCrime }]);
            }},
            { label: "معاينة منافذ الغرفة ومسار الهروب", action: () => {
                addClue(`حيلة القاتل: ${currentCase.trick.clue}`);
                setScene(`كشفت نظارات التحليل المكبرة أثراً حاسماً:\n${currentCase.trick.clue}.`, [{ label: "فحص أثر آخر", action: inspectCrime }]);
            }},
            { label: "رجوع للقاعة", action: caseHub }
        ]);
    }

    function talkSuspects() {
        let buttons = currentCase.suspects.map(s => ({
            label: `${s.name} (${s.role})`,
            action: () => {
                if (s.name === currentCase.culprit.name && currentCase.calledTrap) {
                    addClue(`علامة إدانة: ${currentCase.culprit.name} تظهر عليه [${currentCase.trick.tell}]`);
                    setScene(`${s.name} ارتبك بشدة وتراجع للخلف ممسكاً بملابسه، ولاحظت بوضوح:\n${currentCase.trick.tell}!`, [{ label: "مشتبه به آخر", action: talkSuspects }]);
                } else {
                    setScene(`${s.name} يبدو متماسكاً وأكد وجود حجة غياب تنفي تواجده في الغرفة وقت الحادث.`, [{ label: "مشتبه به آخر", action: talkSuspects }]);
                }
            }
        }));
        buttons.push({ label: "رجوع", action: caseHub });
        setScene("اختر الشخص الذي ترغب في استجوابه ومطابقة أقواله:", buttons);
    }

    function fakeCall() {
        if (!collectedClues.some(c => c.includes("دافع الجريمة"))) {
            setScene("افحص جثة الضحية أولاً لكشف سر الجريمة وصياغة فخ المكالمة!", [{ label: "رجوع", action: caseHub }]);
            return;
        }
        if (!isMuted) ringSound.play().catch(() => {});
        currentCase.calledTrap = true;
        setScene(
            `📞 غيرت نبرة صوتك إلى [${currentCase.victim}] وهاتفت هاتف القاعة:\n"${currentCase.motive.callTrigger}"\n\nعمّ الصمت فجأة وارتجف الجاني ظناً أن سره انكشف! استجوبهم الآن لتلتقط الدليل.`,
            [{ label: "مراقبة ردود الأفعال واستجواب المشتبه بهم", action: talkSuspects }]
        );
    }

    function saveProgress() {
        localStorage.setItem("conan_stage", currentCaseNum);
        localStorage.setItem("conan_score", totalScore);

        const playerKey = encodeURIComponent(playerName.trim().toLowerCase());
        const playerRef = db.ref("leaderboard/" + playerKey);

        playerRef.once("value", snapshot => {
            const currentData = snapshot.val();
            if (!currentData || totalScore > (currentData.score || 0)) {
                playerRef.set({
                    name: playerName.trim(),
                    stage: currentCaseNum,
                    score: totalScore,
                    lastUpdate: Date.now()
                });
            }
        });
    }

    function accusePhase() {
        let buttons = currentCase.suspects.map(s => ({
            label: `المتهم هو: ${s.name}`,
            action: () => {
                if (s.name === currentCase.culprit.name) {
                    const hasTrick = collectedClues.some(c => c.includes("حيلة القاتل"));
                    const hasTell = collectedClues.some(c => c.includes("علامة إدانة"));

                    if (hasTrick && hasTell) {
                        const earnedPoints = 150;
                        totalScore += earnedPoints;
                        currentCaseNum++;
                        saveProgress();

                        setScene(
                            `استنتاج عبقري وقاطع يا ${playerName}!\n'القات

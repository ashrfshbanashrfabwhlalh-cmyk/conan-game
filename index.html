<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحقق: سجل القضايا الغامضة</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e14;
            color: #d1d7e0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-card {
            background: #161b22;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { color: #f0883e; text-align: center; margin: 0 0 5px 0; font-size: 1.3rem; }
        .sub { text-align: center; font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
        .status-bar {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .level-box { color: #58a6ff; }
        .score-box { color: #3fb950; }
        .scene-box {
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #f0883e;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 90px;
            white-space: pre-line;
            font-size: 0.95rem;
        }
        .btn-stack { display: flex; flex-direction: column; gap: 8px; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #2ea043; }
        button.tool-btn { background: #1f6feb; }
        button.danger { background: #da3633; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .inventory-panel {
            margin-top: 15px;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #30363d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div id="game-card">
    <h1>المحقق: سجل القضايا الغامضة</h1>
    <div class="sub">نظام التحقيق الجنائي المباشر</div>

    <div class="status-bar">
        <div class="level-box" id="level-display">القضية: #1</div>
        <div class="score-box" id="score-display">النقاط: 0</div>
    </div>

    <div class="scene-box" id="scene-text">
        اكتب اسم المحقق واضغط على الزر الأخضر للبدء فوراً!
    </div>

    <div class="btn-stack" id="actions">
        <input type="text" id="player-name" placeholder="اكتب اسم المحقق هنا" maxlength="15">
        <button id="start-btn" type="button">تولي ملف القضية</button>
    </div>

    <div class="inventory-panel" id="clues-box" style="display: none;">
        <strong style="color: #58a6ff;">💼 حقيبة الأدلة المستجمعة:</strong>
        <div id="clues-list">لا توجد أدلة بعد.</div>
    </div>
</div>

<script>
    const FIRST_NAMES = ["دايسوكي", "ساتوشي", "ريوتا", "تاتسويا", "ماكوتو", "يومي", "أكاني", "ناتسوكي", "ناوكي", "رين"];
    const LAST_NAMES = ["موري", "كودو", "هاتوري", "أوكازاكي", "سوزوكي", "تاكاجي", "يامادا", "تشيبا", "فوجيوارا"];
    const OCCUPATIONS = ["طبيب شرعي", "مهندس تقني", "محامي دفاع", "رجل أعمال", "مديرة فنادق", "مؤلفة روايات"];

    const LOCATIONS = [
        "فيلا معزولة على قمة جبلية ثلجية",
        "مقصورة الدرجة الأولى بقطار ليلي سريع",
        "قبو بنك استثماري محكم الإغلاق",
        "صالة العرض بمتحف الآثار المغلق"
    ];

    const TRICKS = [
        { name: "خيط الصيد المشدود بالمزلاج", clue: "أثر سحجة ميكروسكوبية وخيط شفاف تحت عتبة الباب", tell: "جروح دقيقة وخدوش رفيعة في باطن أصابعه" },
        { name: "ذوبان كتلة الثلج الجاف الموقوتة", clue: "بقعة رطوبة متبخرة وآثار غاز كربوني قرب النافذة", tell: "رائحة مادة تبريد وتكثف بارد في أطراف أكمامه" },
        { name: "إبرة مسممة في مقبض الباب", clue: "ثقب إبرة مجهري ورائحة لوز مرّة عند المقبض", tell: "يرتدي قفازاً جلدياً لإخفاء ثقب بإصبعه" }
    ];

    const MOTIVES = [
        { secret: "خزنة الاختلاس والوثائق البنكية المزورة", call: "سأفتح الخزنة الآن لأكشف تزويرك المالي أمام الشرطة!" },
        { secret: "مسودة الوصية الأصلية وحرمان الورثة", call: "مسودة الوصية بحوزتي ولن تنال شيئاً!" },
        { secret: "تسجيل صوتي سري يوثق جريمة ابتزاز", call: "شريط الابتزاز في يدي وسأسلمه للمفتش حالاً!" }
    ];

    let currentCaseNum = 1;
    let totalScore = 0;
    let playerName = "";
    let currentCase = {};
    let collectedClues = [];

    const levelEl = document.getElementById("level-display");
    const scoreEl = document.getElementById("score-display");
    const textEl = document.getElementById("scene-text");
    const actionsEl = document.getElementById("actions");
    const cluesList = document.getElementById("clues-list");
    const startBtn = document.getElementById("start-btn");

    startBtn.addEventListener("click", function() {
        const input = document.getElementById("player-name").value.trim();
        if (!input) {
            alert("اكتب اسم المحقق أولاً!");
            return;
        }
        playerName = input;
        document.getElementById("clues-box").style.display = "block";
        buildCase();
    });

    function buildCase() {
        collectedClues = [];
        cluesList.innerHTML = "لا توجد أدلة بعد.";

        const vicF = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
        const vicL = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
        const vicO = OCCUPATIONS[Math.floor(Math.random() * OCCUPATIONS.length)];

        const loc = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
        const trk = TRICKS[Math.floor(Math.random() * TRICKS.length)];
        const mot = MOTIVES[Math.floor(Math.random() * MOTIVES.length)];

        let suspects = [];
        for(let i = 0; i < 3; i++) {
            const f = FIRST_NAMES[(Math.floor(Math.random() * FIRST_NAMES.length) + i + 1) % FIRST_NAMES.length];
            const l = LAST_NAMES[(Math.floor(Math.random() * LAST_NAMES.length) + i + 1) % LAST_NAMES.length];
            const o = OCCUPATIONS[(Math.floor(Math.random() * OCCUPATIONS.length) + i) % OCCUPATIONS.length];
            suspects.push({ name: `${f} ${l}`, role: o });
        }

        currentCase = {
            victim: `${vicO}: ${vicF} ${vicL}`,
            location: loc,
            trick: trk,
            motive: mot,
            suspects: suspects,
            culprit: suspects[0],
            calledTrap: false
        };

        levelEl.innerText = `القضية: #${currentCaseNum}`;
        scoreEl.innerText = `النقاط: ${totalScore}`;
        renderHub();
    }

    function renderScene(txt, btns) {
        textEl.innerText = txt;
        actionsEl.innerHTML = "";
        btns.forEach(b => {
            const btn = document.createElement("button");
            btn.innerText = b.label;
            if (b.className) btn.className = b.className;
            btn.onclick = b.action;
            actionsEl.appendChild(btn);
        });
    }

    function renderHub() {
        renderScene(
            `القضية #${currentCaseNum}\n📍 مسرح الجريمة: [${currentCase.location}]\nالضحية: ${currentCase.victim}\n\nالمشتبه بهم:\n${currentCase.suspects.map(s => `• ${s.name} (${s.role})`).join('\n')}`,
            [
                { label: "🔍 فحص مسرح الجريمة والآثار", action: inspectScene },
                { label: "👥 استجواب المشتبه بهم", action: interrogations },
                { label: "🎙️ فخ بمغير الصوت (مكالمة وهمية)", action: phoneTrap, className: "tool-btn" },
                { label: "⚡ توجيه الاتهام الحاسم!", action: accuseTarget, className: "danger" }
            ]
        );
    }

    function inspectScene() {
        renderScene("اختر مسار التحقيق:", [
            { label: "فحص جثة الضحية ومقتنياتها", action: () => {
                addClue(`دافع الجريمة: [${currentCase.motive.secret}]`);
                renderScene(`الدافع المكتشف: ${currentCase.motive.secret}.`, [{ label: "موقع آخر", action: inspectScene }]);
            }},
            { label: `معاينة منافذ المكان`, action: () => {
                addClue(`حيلة القاتل: ${currentCase.trick.clue}`);
                renderScene(`العلامة المكتشفة: ${currentCase.trick.clue}.`, [{ label: "موقع آخر", action: inspectScene }]);
            }},
            { label: "رجوع", action: renderHub }
        ]);
    }

    function addClue(c) {
        if (!collectedClues.includes(c)) {
            collectedClues.push(c);
            cluesList.innerHTML = collectedClues.map(i => `• ${i}`).join("<br>");
        }
    }

    function interrogations() {
        let btns = currentCase.suspects.map(s => ({
            label: `${s.name} (${s.role})`,
            action: () => {
                if (s.name === currentCase.culprit.name && currentCase.calledTrap) {
                    addClue(`علامة إدانة: تظهر على ${currentCase.culprit.name} [${currentCase.trick.tell}]`);
                    renderScene(`${s.name} ارتبك بعد المكالمة:\n${currentCase.trick.tell}!`, [{ label: "مشتبه به آخر", action: interrogations }]);
                } else {
                    renderScene(`${s.name} يؤكد وجود حجة غياب قوية.`, [{ label: "مشتبه به آخر", action: interrogations }]);
                }
            }
        }));
        btns.push({ label: "رجوع", action: renderHub });
        renderScene("اختر المشتبه به:", btns);
    }

    function phoneTrap() {
        if (!collectedClues.some(c => c.includes("دافع الجريمة"))) {
            renderScene("افحص الضحية أولاً لمعرفة الدافع قبل الاتصال!", [{ label: "رجوع", action: renderHub }]);
            return;
        }
        currentCase.calledTrap = true;
        renderScene(
            `📞 تقمصت الصوت وهاتفت الموقع:\n"${currentCase.motive.call}"\nارتبك الجاني! استجوبهم الآن.`,
            [{ label: "استجواب المشتبه بهم", action: interrogations }]
        );
    }

    function accuseTarget() {
        let btns = currentCase.suspects.map(s => ({
            label: `المتهم: ${s.name}`,
            action: () => {
                if (s.name === currentCase.culprit.name) {
                    const hasTrick = collectedClues.some(c => c.includes("حيلة القاتل"));
                    const hasTell = collectedClues.some(c => c.includes("علامة إدانة"));

                    if (hasTrick && hasTell) {
                        totalScore += 150;
                        currentCaseNum++;
                        renderScene(
                            `أحسنت يا محقق ${playerName}! القاتل هو ${s.name}.\nاعترف بجريمته! (+150 نقطة)`,
                            [{ label: `القضية التالية (#${currentCaseNum}) 🚀`, action: buildCase }]
                        );
                    } else {
                        renderScene("اتهام صحيح لكن دون أدلة كافية تثبت الحيلة وارتباك الجاني! هرب القاتل.", [{ label: "محاولة جديدة", action: buildCase }]);
                    }
                } else {
                    renderScene("اتهام خاطئ تماماً! هرب القاتل الحقيقي.", [{ label: "محاولة جديدة", action: buildCase }]);
                }
            }
        }));
        btns.push({ label: "تراجع", action: renderHub });
        renderScene("وجه إصبع الاتهام نحو القاتل الحقيقي:", btns);
    }
</script>

</body>
</html>

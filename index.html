<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحقق: سجل الـ 100 قضية</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0e14;
            color: #d1d7e0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-card {
            background: #161b22;
            width: 100%;
            max-width: 520px;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            position: relative;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .sound-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        h1 { color: #f0883e; text-align: center; margin: 0; font-size: 1.25rem; }
        .sub { text-align: center; font-size: 0.8rem; color: #8b949e; margin-top: 4px; margin-bottom: 10px; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #0d1117;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .level-box { color: #f1e05a; }
        .score-box { color: #3fb950; }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #f0883e, #3fb950);
            width: 1%;
            transition: width 0.3s;
        }
        .scene-box {
            background: #21262d;
            padding: 14px;
            border-radius: 8px;
            border-right: 4px solid #f0883e;
            line-height: 1.6;
            margin-bottom: 12px;
            min-height: 100px;
            white-space: pre-line;
            font-size: 0.92rem;
        }
        .case-title {
            color: #58a6ff;
            font-size: 1.05rem;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            border-bottom: 1px dashed #30363d;
            padding-bottom: 4px;
        }
        .btn-stack { display: flex; flex-direction: column; gap: 8px; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 0.92rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #2ea043; }
        button.tool-btn { background: #1f6feb; }
        button.danger { background: #da3633; }
        input[type="text"] {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 0.95rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .inventory-panel {
            margin-top: 12px;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #30363d;
            font-size: 0.85rem;
        }
        .leaderboard {
            margin-top: 15px;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .leaderboard h3 { margin: 0 0 10px 0; color: #58a6ff; font-size: 0.9rem; text-align: center; }
        .ranking-scroll { max-height: 140px; overflow-y: auto; }
        .ranking-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 4px;
            border-bottom: 1px solid #21262d;
            font-size: 0.82rem;
        }
        .ranking-row:nth-child(1) { color: #f1e05a; font-weight: bold; }
        .developer-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #30363d;
            font-size: 0.82rem;
            color: #8b949e;
        }
        .contact-links { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }
        .contact-btn {
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.8rem;
        }
        .wa-btn { background-color: #238636; }
        .fb-btn { background-color: #1877f2; }
        .fingerprint-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            padding: 10px;
            background: #0d1117;
            border: 1px dashed #30363d;
            border-radius: 8px;
        }
        .fingerprint-panel.show { display: flex; }
        .fingerprint-panel svg {
            width: 88px;
            height: 88px;
            animation: fp-pulse 2.4s ease-in-out infinite;
        }
        .fingerprint-panel span {
            font-size: 0.78rem;
            color: #8b949e;
        }
        @keyframes fp-pulse {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-card">
    <div class="header-controls">
        <span style="font-size: 0.8rem; color: #8b949e;">🔎 تحدي الـ 100 قضية</span>
        <button class="sound-btn" onclick="toggleMute()" id="mute-btn">🔊 الصوت: مفعل</button>
    </div>

    <h1>المحقق: سجل الـ 100 قضية</h1>
    <div class="sub">100 لغز فريد: اكشف التناقض القاتل في شهادات المشتبه بهم!</div>

    <div class="status-bar">
        <div class="level-box" id="level-display">القضية: #1 / 100</div>
        <div class="score-box" id="score-dis
